[tools]
node = "lts"
python = "latest"
bun = "latest"
# Pi standalone release binary: embeds its own runtime, immune to project .nvmrc/.node-version.
"github:earendil-works/pi" = "latest"
"github:modem-dev/hunk" = "latest"
"github:agavra/tuicr" = "latest"
"github:github/gh-stack" = { version = "latest", bin = "gh-stack" }
"npm:gh-axi" = "latest"
"npm:chrome-devtools-axi" = "latest"
"npm:lavish-axi" = "latest"
"npm:quota-axi" = "latest"
"npm:tasks-axi" = "latest"
uv = "latest"

[env]
# pi-claude-auth pins Claude Code 2.1.160; newer models need >= 2.1.280
ANTHROPIC_CLI_VERSION = "2.1.280"

[settings]
# Respect .nvmrc / .node-version in projects (e.g. Hality pins Node 20)
idiomatic_version_file_enable_tools = ["node"]
